[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "respatch"
version = "1.1.0"
authors = [
  { name="Respatch", email="developers@respatch.com" },
]
description = "Official Python SDK for the Respatch logistics and delivery API"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.25.0",
]

[project.urls]
"Homepage" = "https://respatch.com"

[tool.setuptools.packages.find]
where = ["."]
include = ["transmit*", "respatch*"]
