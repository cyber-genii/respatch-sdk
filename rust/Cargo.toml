[package]
name = "respatch-rust-sdk"
version = "0.1.1"
edition = "2021"
authors = ["Respatch <developers@respatch.com>"]
description = "Official Rust SDK for the Respatch logistics and delivery API"
license = "MIT"

[lib]
name = "respatch_rust_sdk"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
